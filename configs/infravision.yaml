# InfraVision pipeline settings. Every key is optional: missing keys use the
# defaults in infravision/config.py. Paths are relative to the repository root.
# Pass another file with --config, or override single keys in code:
#   load_config(overrides={"sr": {"scale": 1}})

device: auto            # auto | cpu | cuda | cuda:0

# Dataset folders: first existing one wins (repo-local POP/ or a shared ../datasets/).
datasets:
  pop:
    - POP
    - ../datasets/POP
  llvip:                # colorizer training (infravision.train.thermovision)
    - LLVIP
    - ../datasets/LLVIP

# Branch A: denoise -> super-resolution -> CLAHE (clahe_stage: post) -> colorize.
pre_enhance:
  enabled: true
  denoise: true
  denoise_method: bilateral   # bilateral (fast, edge-preserving) | nlmeans (old default, ~2.5 s/frame)
  bilateral_d: 5
  bilateral_sigma_color: 20
  bilateral_sigma_space: 5
  denoise_strength: 5   # nlmeans only: cv2.fastNlMeansDenoising h; 0 disables
  clahe: true
  clahe_stage: post     # post = after SR (does not feed amplified noise to SR) | pre = old order
  clahe_clip: 1.5       # contrast limit; higher = stronger local contrast
  clahe_tiles: 8        # grid size (tiles per side)

# Branch A step 2: super-resolution (EDSR on a bicubic-upscaled frame).
sr:
  enabled: true
  backend: edsr         # edsr (falls back to bicubic without weights) | bicubic
  scale: 2              # output size = input size * scale (1 = restore only)
  max_input_side: 1280  # longer inputs are processed in tiles of this size
  # First existing file wins. checkpoints/ is written by infravision.train.sr.
  weights:
    - checkpoints/sr/edsr_best.pth
    - SR/checkpoints_pop/ssim_residual/edsr_ssim_residual_epoch_10.pth
    - SR/checkpoints/ssim_residual/edsr_ssim_residual_epoch_10.pth

# Branch A step 3: thermal (1 channel) -> RGB (3 channels).
colorizer:
  enabled: true
  backend: thermovision # thermovision (U-Net, default) | infravision_tiny (old ResnetGenerator)
  device: auto          # auto = same as the pipeline device | cpu | cuda (falls back to CPU with a warning)
  input: auto           # auto | raw | enhanced. auto = raw for thermovision (trained on raw previews),
                        # enhanced (CLAHE + SR frame) for infravision_tiny
  detail: 0.5           # add back SR thermal detail to the upsampled colour (0 = off)
  # thermovision backend: one checkpoint, run on the whole frame at input_size x input_size.
  # From colab_training/train_colorizer_kaggle.ipynb (LLVIP). Old ThermoVision exp7: thermovision_exp7_last.pth
  checkpoint: checkpoints/colorizer/thermovision_llvip_v1.pth
  input_size: 256       # the size the U-Net was trained at (multiple of 32)
  # infravision_tiny backend: first existing file wins, run at work_side (longer side).
  work_side: 640
  weights:
    - checkpoints/colorizer/colorizer_best.pth
    - checkpoints/colorizer/infravision_tiny_75x3.pth   # 75-pair CPU baseline from the audit, for comparison
    - colorization/checkpoints/cyclegan/colorizer_G_AB.pth
  fallback_colormap: inferno   # used, and reported, when no colorizer weights exist

# Branch B: person detection.
detection:
  run_on: original      # original | enhanced (pre-enhanced, same size as input)
  imgsz: 1024           # POP is 1280x1024 with people 20-40 px tall
  conf: 0.25            # overridden by checkpoints/yolo/thresholds.json when present
  iou: 0.5
  tile: 0               # 0 = whole frame; N = N x N overlapping tiles (small people)
  tile_overlap: 0.2
  weights:
    - checkpoints/yolo/best.pt
    - human_detection/runs/pop/pop_1024/weights/best.pt
    - human_detection/runs/pop/baseline/weights/best.pt
    - human_detection/runs/thermal/colab_resumed/weights/best.pt

# Fusion: how detections are drawn on the colorized image.
fusion:
  box_color: [0, 255, 0]      # RGB
  outline_color: [0, 0, 0]    # dark outline around every box for contrast
  thickness: 0                # 0 = scale with image size
  show_conf: true
  label_people_count: true
